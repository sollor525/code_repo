[agent]
name = "ebpf_tls_agent_test"
version = "0.1.0"
log_level = "info"
buffer_pool_size = 5000
buffer_size = 8192

[extraction]
enabled = true
kernel_version_requirement = "5.0.0"
capture_client_random = true
capture_master_secret = true
process_filters = ["nginx", "apache2", "httpd"]

[transport]
enabled_transports = ["Udp"]

[transport.udp]
enabled = true
server_host = "127.0.0.1"
server_port = 9999
batch_size = 100
compression = true

[transport.tcp]
enabled = false
server_host = "127.0.0.1"
server_port = 9998
connection_timeout = 30
max_retries = 3

[transport.remote_config]
enabled = false
config_server_url = "http://127.0.0.1:8080/config"
poll_interval = 300
auto_update = true

[[filters]]
name = "https_only"
enabled = true
five_tuple = { dst_port = 443, protocol = "TCP" }
priority = 100

[[filters]]
name = "test_filter"
enabled = true
process_name = "nginx"
priority = 90