# DPDK FDIR Demo 配置文件
# 格式: id=type,priority,queue,参数...
#
# 类型:
#   ipv4 - IPv4流量
#   ipv6 - IPv6流量
#   tcp  - TCP流量
#   udp  - UDP流量
#   vlan - VLAN流量
#   http - HTTP流量
#   tls  - TLS流量
#
# 参数格式: key=value,key=value,...

# IPv4 TCP规则 - 所有IPv4 TCP流量到队列0
100=ipv4,10,0,proto=tcp

# HTTP规则 - HTTP流量到队列1
101=http,20,1,dport=80,method=GET

# HTTPS规则 - HTTPS/TLS流量到队列2
102=tls,20,2,dport=443

# DNS规则 - DNS查询到队列3
103=udp,30,3,dport=53

# 特定IP规则 - 192.168.1.0/24网段到队列4
104=ipv4,15,4,src=192.168.1.0/24,proto=tcp

# VLAN规则 - VLAN 100到队列5
200=vlan,25,5,vlan=100

# IPv6规则 - 所有IPv6流量到队列6
300=ipv6,5,6

# 高优先级规则 - 管理流量到队列7
400=tcp,1,7,dport=22,src=10.0.0.0/8

# 丢弃规则 - 丢弃特定IP的流量
999=ipv4,0,0,dst=1.2.3.4,action=drop