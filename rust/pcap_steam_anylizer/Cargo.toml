[package]
name = "pcap_steam_anylizer"
version = "0.1.0"
edition = "2024"

[dependencies]
pcap = "1.0"
etherparse = "0.13"
hashbrown = "0.14"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
prettytable-rs = "0.10"
indicatif = "0.17"
console = "0.15"
tempfile = "3.8"
num_cpus = "1.16"
rayon = "1.7"
