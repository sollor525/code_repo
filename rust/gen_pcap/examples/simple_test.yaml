# 简单测试模板
metadata:
  name: "Simple Test"
  description: "简单的TCP和HTTP测试"
  version: "1.0"

network:
  src_mac: "00:11:22:33:44:55"
  dst_mac: "e2:c9:fc:f5:9e:3c"

sessions:
  - name: "test_tcp"
    repeat: 1
    connection:
      src:
        ip: "10.10.1.100"
        port: 12345
      dst:
        ip: "192.168.1.100"
        port: 80
    session_type:
      type: "Tcp"
      ports: [80]
      duration_ms: 1000
    application:
      Http:
        requests:
          - method: "GET"
            uri: "/"
            headers:
              Host: "example.com"
        responses:
          - status_code: 200
            headers:
              Content-Type: "text/html"
            body: "<h1>Test</h1>"