[package]
name = "gen_pcap"
version = "0.1.0"
edition = "2021"

[dependencies]
pcap = "1.0"
pnet = "0.33"
libc = "0.2"
clap = { version = "4.0", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
indexmap = "2.0"
anyhow = "1.0"
md5 = "0.7"
thiserror = "1.0"
serde_json = "1.0"

[[example]]
name = "http_example"
path = "examples/http_example.rs"

[[example]]
name = "encapsulated_functions_example"
path = "examples/encapsulated_functions_example.rs"