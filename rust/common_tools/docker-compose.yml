version: '3.8'

services:
  common-tools:
    build: .
    container_name: common-tools
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - LISTEN_ADDRESS=0.0.0.0:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/app/logs
    networks:
      - common-tools-network

networks:
  common-tools-network:
    driver: bridge

volumes:
  logs:
    driver: local