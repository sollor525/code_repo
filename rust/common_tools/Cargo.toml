[package]
name = "common_tools"
version = "0.1.0"
edition = "2021"
authors = ["Common Tools Developer"]
description = "A collection of common utility tools"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
byteorder = "1.4"
hex = "0.4"
pnet = "0.34"
pcap-file = "2.0"
regex = "1.10"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
mime_guess = "2.0"

[[bin]]
name = "common_tools"
path = "src/main.rs"