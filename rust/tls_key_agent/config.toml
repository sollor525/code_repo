# TLS Key Agent 配置文件

[agent]
name = "tls_key_agent"
version = "0.1.0"
log_level = "info"
buffer_pool_size = 1000
buffer_size = 8192

[extraction]
enabled = true
capture_client_random = true
capture_master_secret = true
capture_session_ticket = false
library_path = "./libtls_key_agent.so"

[transport]
enabled_transports = ["Tcp"]
max_retries = 3
timeout = 30

[transport.tcp]
enabled = true
server_host = "127.0.0.1"
server_port = 9999
reconnect_interval = 5
max_retries = 10
timeout = 10

[transport.file]
enabled = false
output_path = "./tls_keys.log"
rotation = true
max_file_size = 104857600  # 100MB
max_files = 10

# 过滤规则示例
[[filters]]
name = "nginx_https"
enabled = true
five_tuple = { dst_port = 443 }
process_name = "nginx"

[[filters]]
name = "apache_ssl"
enabled = true
five_tuple = { dst_port = 443 }
process_name = "apache2"

[[filters]]
name = "smtp_tls"
enabled = true
five_tuple = { dst_port = 587, protocol = "TCP" }
process_name = "postfix"