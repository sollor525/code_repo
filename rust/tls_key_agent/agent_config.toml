# TLS Key Agent 配置文件
# 企业级密钥管理配置

[agent]
name = "enterprise_tls_agent"
version = "0.1.0"
log_level = "info"
buffer_pool_size = 5000
buffer_size = 8192

[extraction]
enabled = true
capture_client_random = true
capture_master_secret = true
capture_session_ticket = false
library_path = "./libtls_agent_hook.so"

[transport]
enabled_transports = ["Tcp", "File"]

[transport.tcp]
enabled = true
server_host = "127.0.0.1"
server_port = 9999
reconnect_interval = 5
max_retries = 10
timeout = 10

[transport.file]
enabled = true
output_path = "/tmp/tls_keys_agent.log"
rotation = true
max_file_size = 104857600  # 100MB
max_files = 10

[injection]
enabled = true
method = "preload"
hook_library = "./libtls_agent_hook.so"
auto_inject = true
skip_critical_processes = true
injection_timeout = 30
max_injected_processes = 1000
process_discovery_interval = 5

# 过滤器配置 - 默认配置
[[filters]]
name = "default_http_https"
enabled = true
five_tuple = { dst_port = 80, protocol = "TCP" }

[[filters]]
name = "default_https"
enabled = true
five_tuple = { dst_port = 443, protocol = "TCP" }

[[filters]]
name = "web_servers"
enabled = true
five_tuple = {}
process_name = "nginx|apache|httpd|lighttpd|caddy"