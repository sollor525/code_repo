# TLS Key Agent 配置文件

[agent]
name = "tls_key_agent"
version = "0.1.0"
log_level = "info"
buffer_pool_size = 1000
buffer_size = 8192

[extraction]
enabled = true
kernel_version_requirement = "5.0.0"
capture_client_random = true
capture_master_secret = true
capture_session_ticket = false

[transport]
enabled_transports = ["Udp", "Tcp"]
max_retries = 3
timeout = 30

[transport.udp]
enabled = true
server_host = "127.0.0.1"
server_port = 9999
batch_size = 100
batch_timeout_ms = 1000
compression = true
reconnect_interval = 5
max_retries = 3
timeout = 30

[transport.tcp]
enabled = true
server_host = "127.0.0.1"
server_port = 9999
connection_timeout = 30
keep_alive = true
retry_delay = 1
reconnect_interval = 5
max_retries = 10
timeout = 10

[transport.remote_config]
enabled = false
server_url = "http://127.0.0.1:8080/config"
config_update_interval = 300
config_retry_attempts = 3
connection_timeout = 30

[ebpf_ssl_hook]
enabled = true
kernel_version_requirement = "5.0.0"
clang_path = "/usr/bin/clang"
bpftool_path = "/usr/bin/bpftool"
auto_compile = true
uprobe_timeout_ms = 3000

[injection]
auto_inject = true
process_discovery_interval = 30

# 过滤规则示例
[[filters]]
name = "nginx_https"
enabled = true
five_tuple = { dst_port = 443 }
process_name = "nginx"
priority = 100

[[filters]]
name = "apache_ssl"
enabled = true
five_tuple = { dst_port = 443 }
process_name = "apache2"
priority = 100

[[filters]]
name = "smtp_tls"
enabled = true
five_tuple = { dst_port = 587, protocol = "TCP" }
process_name = "postfix"
priority = 100