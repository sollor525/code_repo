# TLS Key Agent 生产环境配置文件
# 此配置适用于生产环境部署，包含性能优化和安全设置

[agent]
name = "tls_key_agent"
version = "0.1.0"
log_level = "warn"  # 生产环境建议使用warn级别
buffer_pool_size = 5000  # 增加缓冲池大小以处理更高流量
buffer_size = 16384  # 增加缓冲区大小

[extraction]
enabled = true
capture_client_random = true
capture_master_secret = true
capture_session_ticket = false  # 生产环境通常不需要捕获session ticket
library_path = "/usr/local/lib/libtls_key_agent.so"

[transport]
enabled_transports = ["Tcp", "File"]

[transport.tcp]
enabled = true
server_host = "127.0.0.1"
server_port = 9999
reconnect_interval = 3  # 更快的重连间隔
max_retries = 20  # 更多的重试次数
timeout = 15  # 更长的超时时间

[transport.file]
enabled = true
output_path = "/var/log/tls_keys.log"
rotation = true
max_file_size = 524288000  # 500MB
max_files = 20  # 保留更多历史文件

# 生产环境过滤规则 - 只监控关键服务
[[filters]]
name = "http_servers"
enabled = true
[filters.five_tuple]
dst_port = 80
protocol = "TCP"

[[filters]]
name = "https_servers"
enabled = true
[filters.five_tuple]
dst_port = 443
protocol = "TCP"

[[filters]]
name = "web_applications"
enabled = true
process_name = "nginx|apache|httpd|lighttpd|caddy|node|java|python"