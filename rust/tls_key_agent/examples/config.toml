# TLS Key Agent 配置文件示例

[agent]
log_level = "debug"
max_sessions = 1000
session_timeout = 300

[extraction]
method = "ld_preload"
extract_client_random = true
extract_master_secret = true

[filter]
# 默认捕获所有会话
default_action = "capture"

# 过滤规则示例
[[filter.rules]]
name = "https_only"
enabled = true
five_tuple.dst_port = 443
description = "只捕获HTTPS流量"

[[filter.rules]]
name = "nginx_processes"
enabled = false
process_name = "nginx"
description = "捕获nginx进程的TLS会话"

[transport]
enabled_transports = ["tcp", "file"]

[transport.tcp]
enabled = true
server_address = "127.0.0.1:9090"
buffer_size = 65536
timeout = 30

[transport.file]
enabled = true
output_dir = "/tmp/tls_keys"
rotation_size = "100MB"
file_prefix = "tls_keys"