[package]
name = "tls_ja4_core"
version = "0.1.0"
edition = "2024"
description = "Core TLS JA4/JA3 fingerprint extraction library with C API"
authors = ["sollor525@hotmail.com"]
license = "MIT OR Apache-2.0"
keywords = ["tls", "ja4", "ja3", "fingerprint", "c-api"]
categories = ["network-programming", "parsing"]

[lib]
name = "tls_ja4_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
md5 = "0.7"
tls-parser = "0.12.2"
rayon = "1.8"
parking_lot = "0.12"
lazy_static = "1.4"
num_cpus = "1.16"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"

[[bench]]
name = "performance_benchmarks"
harness = false