[package]
name = "tls_ja4"
version = "0.1.0"
edition = "2024"

[dependencies]
pcap = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
md5 = "0.7"
tls-parser = "0.12.2"
pnet = "0.34"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"

[[bench]]
name = "tls_parsing_bench"
harness = false

[[bench]]
name = "simple_bench"
harness = false

[[bench]]
name = "quick_bench"
harness = false
