[package]
name = "tls_ja4"
version = "0.1.0"
edition = "2024"
description = "High-performance TLS JA4/JA3 fingerprint extractor with C API for VPP integration"
authors = ["sollor525@hotmail.com"]
license = "MIT OR Apache-2.0"
keywords = ["tls", "ja4", "ja3", "fingerprint", "vpp"]
categories = ["network-programming", "parsing"]

[dependencies]
pcap = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
md5 = "0.7"
tls-parser = "0.12.2"
pnet = "0.34"
rayon = "1.8"
parking_lot = "0.12"
num_cpus = "1.16"
lazy_static = "1.4"
quiche = { version = "0.20", default-features = false, features = ["boringssl-boring-crate"] }
aes-gcm = "0.10"
aes = "0.8"
tls_ja4_core = { path = "tls_ja4_core" }
tls_ja4_pcap = { path = "tls_ja4_pcap" }

[lib]
name = "tls_ja4"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
tempfile = "3.0"


[[example]]
name = "simple_pcap_test"
path = "examples/simple_pcap_test.rs"

[[example]]
name = "performance_comparison"
path = "examples/performance_comparison.rs"

[[example]]
name = "performance_chart"
path = "examples/performance_chart.rs"
